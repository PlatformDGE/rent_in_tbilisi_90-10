<title>Rent in Tbilisi — Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#1d3560;}
#splash{width:100%;height:100vh;background:#1d3560;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas#mol{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
.logo-outer{position:relative;width:196px;height:196px;display:flex;align-items:center;justify-content:center;animation:logoIn 1.1s cubic-bezier(0.16,1,0.3,1) both;}
.ring{position:absolute;inset:0;border-radius:50%;}
.ring svg{width:100%;height:100%;}
.ring-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:1.5;}
.ring-arc{fill:none;stroke:rgba(255,255,255,0.7);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:80 220;stroke-dashoffset:0;animation:spin 2.4s cubic-bezier(0.4,0,0.2,1) infinite;}
.ring-arc-red{fill:none;stroke:rgba(232,0,26,0.6);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:30 270;stroke-dashoffset:-120;animation:spinRev 3.6s cubic-bezier(0.4,0,0.2,1) infinite;}
.logo-wrap{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;border-radius:36px;background:rgba(255,255,255,0.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:0.5px solid rgba(255,255,255,0.22);box-shadow:0 1px 0 rgba(255,255,255,0.18) inset,0 -1px 0 rgba(0,0,0,0.15) inset,0 24px 48px rgba(0,0,0,0.25);}
.logo-wrap svg{position:relative;z-index:1;}
.tagline{margin-top:32px;display:flex;flex-direction:column;align-items:center;animation:textIn 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s both;}
.title{font-family:'Bebas Neue',sans-serif;font-size:38px;color:#fff;letter-spacing:3px;line-height:1;}
.sep{width:32px;height:0.5px;background:rgba(255,255,255,0.25);margin:10px 0;}
.sub{font-family:'Bebas Neue',sans-serif;font-size:13px;color:rgba(255,255,255,0.38);letter-spacing:6px;}
@keyframes logoIn{from{opacity:0;transform:scale(0.82) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes textIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes spinRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
</style>

<script>
(function(){
  const canvas=document.getElementById('mol'),root=document.getElementById('splash');
  let W,H,ctx,nodes;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function resize(){W=root.offsetWidth;H=root.offsetHeight;canvas.width=W;canvas.height=H;}
  function init(){nodes=Array.from({length:55},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.13,.13),vy:rnd(-.13,.13),r:rnd(2,5),alpha:rnd(.18,.52)}));}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const D=90;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<D){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(90,140,215,${(1-d/D)*.25})`;ctx.lineWidth=.75;ctx.stroke();}
    }
    for(const n of nodes){
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(110,165,245,${n.alpha})`;
      ctx.fill();
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<-10)n.x=W+10;if(n.x>W+10)n.x=-10;
      if(n.y<-10)n.y=H+10;if(n.y>H+10)n.y=-10;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();ctx=canvas.getContext('2d');init();draw();
})();
</script>
